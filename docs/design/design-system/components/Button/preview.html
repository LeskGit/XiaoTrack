<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans)} .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .col{display:flex;flex-direction:column;gap:12px}</style>
</head>
<body>
<div class="col">
  <div class="row">
    <button class="btn btn-primary">Start session</button>
    <button class="btn btn-accent">Finish</button>
    <button class="btn btn-soft">+ Add set</button>
    <button class="btn btn-secondary">Edit</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-danger">Delete session</button>
  </div>
  <div class="row">
    <button class="btn btn-primary btn-lg">Start session</button>
    <button class="btn btn-secondary btn-icon" aria-label="More">⋯</button>
    <button class="btn btn-primary" disabled>Saving…</button>
  </div>
</div>
</body>
</html>

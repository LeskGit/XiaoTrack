<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field — preview</title>
<style>body{margin:0;padding:16px;font-family:var(--font-sans)} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}</style>
</head>
<body>
<div class="grid">
  <label class="field-label">Exercise name<input class="field" value="Incline dumbbell press"></label>
  <label class="field-label">Weight (kg)<input class="field tabular" inputmode="decimal" placeholder="—"></label>
  <label class="field-label">Note<textarea class="field" placeholder="Focus on the descent"></textarea></label>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New session</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="shared/xt-tokens.css">
<link rel="stylesheet" href="ds/xiaotrack/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
</style>
</helmet>
<div class="xt-canvas" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans);">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <a href="Main.dc.html" class="btn btn-ghost btn-icon" style="border-radius: 9999px;" aria-label="Back to sessions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--ink);">New session</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 20px;">
    <label class="field-label">Date <span style="font-size: 12px; font-weight: 500; color: var(--ink-muted);">Optional: leave empty to plan it later</span>
      <input class="field tabular" type="date" value="2026-11-24">
    </label>

    <section style="display: flex; flex-direction: column; gap: 8px;">
      <h2 class="section-label">Exercises · 2</h2>

      <div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="color: var(--ink-muted); cursor: grab;" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
          <h3 style="flex: 1; font-size: 16px; font-weight: 600; color: var(--ink);">Back squat</h3>
          <button class="btn btn-ghost btn-icon" aria-label="Remove Back squat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: 28px repeat(2, minmax(0, 1fr)) minmax(0, 1.2fr); gap: 6px; align-items: center; font-size: 12px; font-weight: 500; color: var(--ink-muted);">
          <span>Set</span><span>Reps min</span><span>Reps max</span><span>Weight (kg)</span>
          <span class="tabular" style="font-size: 14px; color: var(--ink-soft);">1</span><input class="field tabular" style="height: 36px;" value="6" aria-label="Set 1 reps min"><input class="field tabular" style="height: 36px;" value="8" aria-label="Set 1 reps max"><input class="field tabular" style="height: 36px;" value="80" aria-label="Set 1 weight">
          <span class="tabular" style="font-size: 14px; color: var(--ink-soft);">2</span><input class="field tabular" style="height: 36px;" value="6" aria-label="Set 2 reps min"><input class="field tabular" style="height: 36px;" value="8" aria-label="Set 2 reps max"><input class="field tabular" style="height: 36px;" value="80" aria-label="Set 2 weight">
          <span class="tabular" style="font-size: 14px; color: var(--ink-soft);">3</span><input class="field tabular" style="height: 36px;" value="6" aria-label="Set 3 reps min"><input class="field tabular" style="height: 36px;" value="8" aria-label="Set 3 reps max"><input class="field tabular" style="height: 36px;" value="80" aria-label="Set 3 weight">
        </div>
        <button class="btn btn-soft" style="align-self: flex-start;">+ Add set</button>
      </div>

      <div class="card" style="padding: 12px 14px; display: flex; align-items: center; gap: 10px;">
        <span style="color: var(--ink-muted);" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
        <div style="flex: 1; min-width: 0;">
          <h3 style="font-size: 16px; font-weight: 600; color: var(--ink);">Romanian deadlift</h3>
          <p class="tabular" style="font-size: 12px; font-weight: 500; color: var(--ink-muted);">3 sets · 8–10 reps · 70 kg</p>
        </div>
        <button class="btn btn-ghost btn-icon" aria-label="Edit Romanian deadlift sets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      </div>

      <button class="btn btn-secondary">+ Add exercise</button>
    </section>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px;">
    <a href="Main.dc.html" class="btn btn-ghost btn-lg">Cancel</a>
    <a href="workouts-session-planned.dc.html" class="btn btn-primary btn-lg" style="flex: 1;">Create session</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planned session</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="shared/xt-tokens.css">
<link rel="stylesheet" href="ds/xiaotrack/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
</style>
</helmet>
<div class="xt-canvas" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans);">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <a href="Main.dc.html" class="btn btn-ghost btn-icon" style="border-radius: 9999px;" aria-label="Back to sessions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1;">
      <h1 style="font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--ink);">Tomorrow</h1>
      <p class="tabular" style="font-size: 12px; color: var(--ink-muted);">Mon 24 Nov</p>
    </div>
    <span class="badge badge-neutral">Planned</span>
    <button class="btn btn-ghost btn-icon" style="border-radius: 9999px;" aria-label="More actions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 class="section-label">4 exercises · 14 sets</h2>
      <a href="workouts-session-new.dc.html" class="btn btn-ghost" style="min-height: 32px;">Edit</a>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
        <h3 style="font-size: 16px; font-weight: 600; color: var(--ink);">Back squat</h3>
        <span class="tabular" style="font-size: 13px; font-weight: 500; color: var(--ink-soft);">4 × 6–8 · 80 kg</span>
      </div>
      <p style="display: flex; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--accent-soft); font-size: 13px; line-height: 1.4; color: var(--accent-strong);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 10h8M8 14h5"></path></svg>
        Knees out, brace before every descent.
      </p>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
      <h3 style="font-size: 16px; font-weight: 600; color: var(--ink);">Romanian deadlift</h3>
      <span class="tabular" style="font-size: 13px; font-weight: 500; color: var(--ink-soft);">3 × 8–10 · 70 kg</span>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
        <h3 style="font-size: 16px; font-weight: 600; color: var(--ink);">Leg curl</h3>
        <span class="tabular" style="font-size: 13px; font-weight: 500; color: var(--ink-soft);">3 × 10–12 · 35 kg</span>
      </div>
      <p style="display: flex; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--accent-soft); font-size: 13px; line-height: 1.4; color: var(--accent-strong);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 10h8M8 14h5"></path></svg>
        Seat on hole 4, slow negative.
      </p>
    </div>

    <div class="card" style="padding: 14px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
      <h3 style="font-size: 16px; font-weight: 600; color: var(--ink);">Calf raise</h3>
      <span class="tabular" style="font-size: 13px; font-weight: 500; color: var(--ink-soft);">4 × 12–15 · Bodyweight</span>
    </div>

    <label class="field-label" style="margin-top: 4px;">Session notes
      <textarea class="field" placeholder="Anything to remember for this session"></textarea>
    </label>

    <button class="btn btn-ghost" style="align-self: flex-start; color: var(--danger-strong);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      Delete session
    </button>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--surface); border-top: 1px solid var(--line);">
    <a href="workouts-session-live.dc.html" class="btn btn-primary btn-lg" style="width: 100%; box-sizing: border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
      Start session
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New personal exercise</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="shared/xt-tokens.css">
<link rel="stylesheet" href="ds/xiaotrack/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
fieldset{margin:0;padding:0;border:0;min-width:0}
legend{padding:0;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
.seg{flex:1;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.seg:first-child{border-radius:var(--radius-md) 0 0 var(--radius-md)}
.seg:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0;margin-left:-1px}
.seg.is-on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong);position:relative}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);font:inherit;cursor:pointer}
.opt.is-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dot{width:18px;height:18px;flex-shrink:0;margin-top:1px;border-radius:50%;border:1.5px solid var(--line-strong);box-sizing:border-box}
.opt.is-on .dot{border:5px solid var(--accent)}
</style>
</helmet>
<div class="xt-canvas" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: var(--font-sans);">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <a href="workouts-exercises.dc.html" class="btn btn-ghost btn-icon" style="border-radius: 9999px;" aria-label="Back to exercises">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--ink);">New personal exercise</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 20px;">
    <label class="field-label">Name
      <input class="field" value="Incline hammer row">
    </label>
    <label class="field-label">Description <span style="font-size: 12px; font-weight: 500; color: var(--ink-muted);">Optional</span>
      <textarea class="field" placeholder="Machine, setup, variant…">Chest-supported row on the incline bench, neutral grip.</textarea>
    </label>

    <fieldset>
      <legend>Category</legend>
      <div style="display: flex;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="2">
          <button class="{{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">{{c.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="display: flex; flex-direction: column; gap: 8px;">
      <legend>What do you record?</legend>
      <sc-for list="{{measures}}" as="m" hint-placeholder-count="2">
        <button class="{{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">
          <span class="dot" aria-hidden="true"></span>
          <span>
            <span style="display: block; font-size: 14px; font-weight: 600; color: var(--ink);">{{m.label}}</span>
            <span style="display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted);">{{m.hint}}</span>
          </span>
        </button>
      </sc-for>
    </fieldset>

    <p style="display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--info-soft); font-size: 13px; line-height: 1.4; color: var(--info-strong);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>
      Category and what you record are locked once the exercise is used in a session. The name and description stay editable.
    </p>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px;">
    <a href="workouts-exercises.dc.html" class="btn btn-ghost btn-lg">Cancel</a>
    <a href="workouts-exercise-detail.dc.html" class="btn btn-primary btn-lg" style="flex: 1;">Create exercise</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'RESISTANCE', measure: 'REPS_WEIGHT' };
}
renderVals() {
const { cat, measure } = this.state;
const cats = [['RESISTANCE', 'Resistance'], ['CARDIO', 'Cardio']].map(([id, label]) => ({
label,
on: id === cat ? 'true' : 'false',
cls: id === cat ? 'seg is-on' : 'seg',
pick: () => this.setState({ cat: id })
}));
const measures = [
['REPS_WEIGHT', 'Reps and weight', 'Each set: reps done and load in kg (0 = bodyweight)'],
['DURATION_DISTANCE', 'Time and distance', 'Each set: duration, and distance when it applies']
].map(([id, label, hint]) => ({
label,
hint,
on: id === measure ? 'true' : 'false',
cls: id === measure ? 'opt is-on' : 'opt',
pick: () => this.setState({ measure: id })
}));
return { cats, measures };
}
}
</script>
</body>
</html>
